<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Verseforge</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #f7f7f2;
      --muted: #a8a8a2;
      --green: #63e36f;
      --line: rgba(255,255,255,.10);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    body::before {
      width: min(42vw, 520px);
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 50%;
      right: -12vw;
      top: -14vw;
    }

    body::after {
      width: min(36vw, 420px);
      height: 18px;
      background: var(--green);
      left: -10vw;
      bottom: 12vh;
      transform: rotate(-8deg);
      opacity: .95;
    }

    main {
      width: min(760px, calc(100% - 40px));
      padding: 52px 0;
      position: relative;
      z-index: 1;
    }

    .mark {
      width: 54px;
      height: 8px;
      background: var(--green);
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 88px);
      line-height: .95;
      letter-spacing: -0.055em;
      font-weight: 850;
    }

    .status {
      margin-top: 30px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 8px;
    }

    .status p {
      margin: 0;
    }

    .zh {
      font-size: clamp(20px, 3vw, 30px);
      font-weight: 700;
      letter-spacing: .02em;
    }

    .en {
      color: var(--muted);
      font-size: clamp(14px, 1.8vw, 18px);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .corner {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 18px;
      height: 18px;
      border-right: 3px solid var(--green);
      border-bottom: 3px solid var(--green);
    }

    @media (max-width: 560px) {
      main { width: min(100% - 28px, 760px); }
      body::after { left: -24vw; bottom: 9vh; }
      body::before { right: -24vw; top: -10vw; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Verseforge</h1>
    <div class="status" aria-label="Site status">
      <p class="zh">当前页面正在建设中</p>
      <p class="en">This page is currently under construction.</p>
    </div>
    <div class="corner" aria-hidden="true"></div>
  </main>
</body>
</html>
